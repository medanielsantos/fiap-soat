name: fiap-soat

services:
  api:
    build:
      context: ../..
      dockerfile: .docker/Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      APP_HTTP_PORT: "8080"
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-fiap_soat}
      DB_USER: ${DB_USER:-fiap_soat}
      DB_PASSWORD: ${DB_PASSWORD:-fiap-soat-local}
      DB_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-123456}
      JWT_ISSUER: ${JWT_ISSUER:-fiap-soat}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-redis-password}@redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@oficina.local}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3000/redefinir-senha}
      CUSTOMER_PASSWORD_RESET_URL: ${CUSTOMER_PASSWORD_RESET_URL:-http://localhost:3000/redefinir-senha-cliente}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${APP_HTTP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:8080/health | grep -q '"status":"ok"'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fiap_soat}
      POSTGRES_USER: ${DB_USER:-fiap_soat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fiap-soat-local}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ../postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:-local-redis-password}
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
